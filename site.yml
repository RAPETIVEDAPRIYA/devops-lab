---
- name: Provision the tradelive VM
  hosts: tradelive
  become: yes
  become_method: sudo

  vars_files:
    - vars/secrets.yml

  tasks:
    # Your existing Experiment 6 tasks go here
    # ...

    - name: Install the Google Authenticator PAM module
      apt:
        name: libpam-google-authenticator
        update_cache: yes
        state: present

    - name: Tell PAM to use Google Authenticator for SSH
      lineinfile:
        path: /etc/pam.d/sshd
        line: "auth required pam_google_authenticator.so nullok"
        state: present
      notify: Restart SSH

    - name: Turn off PAM password logins for SSH
      lineinfile:
        path: /etc/pam.d/sshd
        regexp: '^@include common-auth'
        line: "#@include common-auth"
      notify: Restart SSH

    - name: Allow keyboard-interactive logins
      lineinfile:
        path: /etc/ssh/sshd_config
        regexp: '^#?KbdInteractiveAuthentication'
        line: "KbdInteractiveAuthentication yes"
      notify: Restart SSH

    - name: Require key AND code for trader only
      blockinfile:
        path: /etc/ssh/sshd_config
        marker: "# {mark} TRADER 2FA"
        block: |
          Match User trader
          AuthenticationMethods publickey,keyboard-interactive
      notify: Restart SSH

    - name: Install a sudoers policy for the developers group
      copy:
        dest: /etc/sudoers.d/developers
        owner: root
        group: root
        mode: '0440'
        validate: /usr/sbin/visudo -cf %s
        content: |
          Cmnd_Alias SERVICE_CMDS = /usr/bin/systemctl status ssh, \
          /usr/bin/systemctl restart ssh
          Cmnd_Alias PKG_CMDS = /usr/bin/apt update
          %developers ALL=(ALL) NOPASSWD: SERVICE_CMDS, PKG_CMDS


  handlers:
    - name: Restart SSH
      service:
        name: ssh
        state: restarted
